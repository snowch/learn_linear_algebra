name: Deploy book and interactive course to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node for the interactive course
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify the interactive course
        working-directory: interactive
        run: |
          npm test
          node --check dist/app.js
          node --check dist/python-worker.js

      - name: Set up Python for the original book
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the compatible Jupyter Book renderer
        run: pip install 'jupyter-book>=1,<2'

      - name: Render the original book using stored notebook outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path('_config.yml').read_text())
          config.setdefault('execute', {})['execute_notebooks'] = 'off'
          config['exclude_patterns'] = [*config.get('exclude_patterns', []), 'interactive/**']
          Path('/tmp/linear-algebra-pages.yml').write_text(yaml.safe_dump(config))
          PY
          jupyter-book build . --config /tmp/linear-algebra-pages.yml

      - name: Add the browser-local interactive course
        run: |
          mkdir -p _build/html/interactive
          cp -R interactive/dist/. _build/html/interactive/
          touch _build/html/.nojekyll
          test -s _build/html/interactive/index.html
          test -s _build/html/interactive/python-worker.js

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload the complete site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
