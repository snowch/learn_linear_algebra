name: Deploy book and interactive course to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node for the interactive course
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify the interactive course
        working-directory: interactive
        run: |
          npm test
          node --check dist/app.js
          node --check dist/python-worker.js
          npm install --prefix "$RUNNER_TEMP/linear-algebra-tests" --no-audit --no-fund linkedom@0.18.12
          node scripts/verify-dom.mjs "$RUNNER_TEMP/linear-algebra-tests/node_modules/linkedom/worker.js"

      - name: Set up Python for the original book
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the compatible Jupyter Book renderer
        run: pip install 'jupyter-book>=1,<2'

      - name: Render the original book using stored notebook outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path('_config.yml').read_text())
          config.setdefault('execute', {})['execute_notebooks'] = 'off'
          config['exclude_patterns'] = [*config.get('exclude_patterns', []), 'interactive/**']
          Path('/tmp/linear-algebra-pages.yml').write_text(yaml.safe_dump(config))
          PY
          jupyter-book build . --config /tmp/linear-algebra-pages.yml

      - name: Bundle the interactive Python runtime
        run: python interactive/tools/vendor-python.py

      - name: Verify cold self-hosted Python startup
        working-directory: interactive
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:runtime

      - name: Add the browser-local interactive course
        run: |
          mkdir -p _build/html/interactive
          cp -R interactive/dist/. _build/html/interactive/
          touch _build/html/.nojekyll
          test -s _build/html/interactive/index.html
          test -s _build/html/interactive/python-worker.js

      - name: Bundle the original book browser assets
        run: python scripts/vendor-browser-assets.py _build/html /learn_linear_algebra

      - name: Upload the complete site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_build/html'

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
