name: Deploy book and interactive course to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node for the interactive course
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify the interactive course
        working-directory: interactive
        run: |
          npm test
          node --check dist/app.js
          node --check dist/python-worker.js
          npm install --prefix "$RUNNER_TEMP/linear-algebra-tests" --no-audit --no-fund linkedom@0.18.12
          node scripts/verify-dom.mjs "$RUNNER_TEMP/linear-algebra-tests/node_modules/linkedom/worker.js"

      - name: Set up Python for the original book
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the compatible Jupyter Book renderer
        run: pip install 'jupyter-book>=1,<2'

      - name: Render the original book using stored notebook outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path('_config.yml').read_text())
          config.setdefault('execute', {})['execute_notebooks'] = 'off'
          config['exclude_patterns'] = [*config.get('exclude_patterns', []), 'interactive/**']
          Path('/tmp/linear-algebra-pages.yml').write_text(yaml.safe_dump(config))
          PY
          jupyter-book build . --config /tmp/linear-algebra-pages.yml

      - name: Bundle the interactive Python runtime
        run: python interactive/tools/vendor-python.py

      - name: Verify cold self-hosted Python startup
        working-directory: interactive
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:runtime
          npm run build
          CHROMIUM=$(node -e "console.log(require('playwright').chromium.executablePath())") npm run test:offline

      - name: Add the browser-local interactive course
        run: |
          mkdir -p _build/html/interactive
          node interactive/scripts/verify-offline-build.mjs interactive/.build/site
          cp -R interactive/.build/site/. _build/html/interactive/
          touch _build/html/.nojekyll
          test -s _build/html/interactive/index.html
          test -s _build/html/interactive/python-worker.js

      - name: Bundle the original book browser assets
        run: |
          python scripts/vendor-browser-assets.py _build/html /learn_linear_algebra
          python scripts/check-browser-assets.py _build/html

      - name: Upload the complete site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: verified-course
          include-hidden-files: true
          path: '_build/html'

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    concurrency:
      group: linear-algebra-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: verified-course
          path: _build/html
      - name: Verify the downloaded interactive course
        run: node interactive/scripts/verify-offline-build.mjs _build/html/interactive
      - name: Preserve older open interactive lessons
        env:
          PUBLISHED_COURSE_URL: https://snowch.github.io/learn_linear_algebra/interactive/
        run: node interactive/scripts/retain-for-publish.mjs _build/html/interactive
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _build/html
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: node interactive/scripts/publication.mjs wait github-pages-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
